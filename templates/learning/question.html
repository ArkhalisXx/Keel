{% extends 'base.html' %}{% block content %}{% if q.paper.kind == 'reviewer' %}<p class="notice">AI-generated reviewer question. Verify important calculations against the cited reference.</p>{% endif %}<p class="eyebrow">{{ q.topic }}</p><section class="card auth"><h1>{{ q.prompt }}</h1><form method="post">{% csrf_token %}{% for i, choice in choices %}<label class="choice"><input type="radio" name="choice" value="{{ i }}" required> {{ choice }}</label>{% endfor %}<button>Check answer</button></form></section>{% endblock %}
