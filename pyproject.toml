[project]
name = "keel-vercel"
version = "0.1.0"
description = "Keel Django serverless deployment profile"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.18",
  "pypdf==6.21.2",
  "python-docx==1.2.0",
  "celery==5.6.3",
  "psycopg[binary]==3.3.6",
  "whitenoise==6.12.0",
  "python-dotenv==1.2.1",
  "django-allauth[socialaccount]==65.21.0",
  "django-storages[s3]==1.14.6",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "vercel_wsgi:application"
